[workspace]
resolver = "2"
members = ["crates/engine", "crates/bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Angela Yu", "Tahmid Ahmed"]

[workspace.dependencies]
engine = { path = "crates/engine" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.test]
opt-level = 2
