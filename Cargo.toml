[package]
name = "game-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Angela Yu", "Tahmid Ahmed"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.test]
opt-level = 2

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
